# Publish only an exact protected-master source with npm provenance.
# Tag releases must name the package version; manual runs must select master.
# This guard controls the existing workflow, not writers replacing that workflow
# on an unprotected ref. An external publication boundary remains root-owned.
# npm authentication still requires configured trusted publishing or NPM_TOKEN;
# this workflow does not configure either or establish credential availability.
name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: admit
        run: node scripts/publish-master-admission.mjs

  publish:
    needs: admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance; admission cannot request it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm admitted checkout
        env:
          ADMITTED_SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ADMITTED_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # existing OIDC-capable npm setup
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
