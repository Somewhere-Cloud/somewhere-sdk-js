# Publish only an exact protected-master source with npm provenance.
# Scoped bootstrap is manual only and must select master.
# This guard controls the existing workflow, not writers replacing that workflow
# on an unprotected ref. An external publication boundary remains root-owned.
# npm authentication: trusted publisher for @somewhere-cloud/sdk = owner Somewhere-Cloud,
# repository somewhere-sdk-js, workflow publish.yml, no environment. NPM_CLOUD_BOOTSTRAP_TOKEN is
# set only for the first-version bootstrap and removed afterwards.
name: Publish to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.admit.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/master
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: admit
        run: node scripts/publish-master-admission.mjs

  publish:
    needs: admission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance; admission cannot request it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.admission.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm admitted checkout
        env:
          ADMITTED_SOURCE_SHA: ${{ needs.admission.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ADMITTED_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@11.19.0 # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - name: Publish (or stage the first version for maintainer approval)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_CLOUD_BOOTSTRAP_TOKEN }} # first-version bootstrap only
          FIRST_VERSION_STAGE: ${{ vars.NPM_FIRST_VERSION_STAGE }} # unset by default
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_CLOUD_BOOTSTRAP_TOKEN is required for bootstrap" >&2; exit 1; fi
          if [ "$FIRST_VERSION_STAGE" = "1" ]; then npm stage publish --provenance --access public
          else npm publish --provenance --access public; fi
